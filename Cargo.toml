[package]
name = "hyprdisplays"
version = "0.1.0"
edition = "2021"
description = "Display manager (hyprdisplays) + PipeWire mixer (hyprvolume) for Hyprland"
license = "MIT"

[dependencies]
iced = { version = "0.14", features = ["canvas", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
chrono = "0.4"

[profile.release]
opt-level = 2
